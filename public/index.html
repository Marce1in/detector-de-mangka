<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detector de Mangaká</title>
    <style>
        :root {
            --bg: #f5f3ee;
            --panel: #ffffff;
            --ink: #171717;
            --muted: #66615a;
            --line: #d8d1c6;
            --accent: #1f6feb;
            --accent-dark: #164ca4;
            --danger: #b42318;
            --shadow: 0 18px 45px rgba(24, 20, 16, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(90deg, rgba(23, 23, 23, 0.035) 1px, transparent 1px),
                linear-gradient(0deg, rgba(23, 23, 23, 0.035) 1px, transparent 1px),
                var(--bg);
            background-size: 28px 28px;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 0.95;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .upload-panel {
            padding: 18px;
        }

        .dropzone {
            display: grid;
            min-height: 430px;
            place-items: center;
            border: 1px dashed #aaa197;
            border-radius: 8px;
            background: #fbfaf7;
            overflow: hidden;
            position: relative;
        }

        .dropzone.is-dragging {
            border-color: var(--accent);
            background: #eef5ff;
        }

        .empty-state {
            display: grid;
            gap: 14px;
            justify-items: center;
            padding: 32px;
            text-align: center;
        }

        .empty-state strong {
            font-size: 1.1rem;
        }

        .empty-state span {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .preview {
            display: none;
            width: 100%;
            height: 100%;
            max-height: 620px;
            object-fit: contain;
            background: #fff;
        }

        .preview.is-visible {
            display: block;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .button {
            appearance: none;
            border: 1px solid var(--ink);
            border-radius: 8px;
            background: var(--ink);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 11px 14px;
        }

        .button.secondary {
            background: #fff;
            color: var(--ink);
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .button:focus-visible {
            outline: 3px solid rgba(31, 111, 235, 0.32);
            outline-offset: 2px;
        }

        .result-panel {
            padding: 18px;
            position: sticky;
            top: 18px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 1rem;
        }

        .result {
            display: grid;
            gap: 12px;
        }

        .model-card {
            display: grid;
            gap: 12px;
            padding: 14px;
            border-radius: 8px;
            background: #f7f8fb;
            border: 1px solid #e2e7f1;
        }

        .model-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .model-name {
            color: var(--ink);
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .class-name {
            overflow-wrap: anywhere;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .confidence {
            color: var(--muted);
        }

        .top-list {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .top-item {
            display: grid;
            gap: 6px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .bar {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: #ebe7df;
        }

        .bar span {
            display: block;
            height: 100%;
            width: 0%;
            background: var(--accent);
        }

        .status {
            min-height: 22px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .status.error {
            color: var(--danger);
        }

        @media (max-width: 860px) {
            main {
                padding: 28px 0;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .result-panel {
                position: static;
            }

            .dropzone {
                min-height: 320px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Detector de Mangaká</h1>
            <p class="subtitle">Envie uma imagem e veja qual mangaká o modelo reconhece.</p>
        </header>

        <div class="layout">
            <section class="panel upload-panel" aria-label="Upload de imagem">
                <form id="upload-form">
                    <label id="dropzone" class="dropzone" for="image-input">
                        <img id="preview" class="preview" alt="Prévia da imagem selecionada">
                        <span id="empty-state" class="empty-state">
                            <strong>Escolha uma imagem</strong>
                            <span>JPEG, PNG, WEBP, BMP, ou cole com Ctrl+V</span>
                        </span>
                    </label>

                    <input id="image-input" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/bmp">

                    <div class="actions">
                        <button class="button secondary" type="button" id="choose-button">Escolher arquivo</button>
                        <button class="button" type="submit" id="submit-button" disabled>Analisar imagem</button>
                    </div>
                </form>
            </section>

            <aside class="panel result-panel" aria-label="Resultado da inferência">
                <h2>Resultado</h2>
                <div id="result" class="result"></div>
                <div id="status" class="status" aria-live="polite">Nenhuma imagem selecionada.</div>
            </aside>
        </div>
    </main>

    <script>
        const form = document.querySelector("#upload-form");
        const input = document.querySelector("#image-input");
        const chooseButton = document.querySelector("#choose-button");
        const submitButton = document.querySelector("#submit-button");
        const dropzone = document.querySelector("#dropzone");
        const preview = document.querySelector("#preview");
        const emptyState = document.querySelector("#empty-state");
        const resultContainer = document.querySelector("#result");
        const status = document.querySelector("#status");

        let previewUrl = null;

        function formatPercent(value) {
            return `${(Number(value || 0) * 100).toFixed(2)}%`;
        }

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle("error", isError);
        }

        function setBusy(isBusy) {
            submitButton.disabled = isBusy || !input.files.length;
            chooseButton.disabled = isBusy;
            submitButton.textContent = isBusy ? "Analisando..." : "Analisar imagem";
        }

        function clearResult() {
            resultContainer.innerHTML = "";
        }

        function assignFile(file) {
            const files = new DataTransfer();
            files.items.add(file);
            input.files = files.files;
            loadFile(file);
        }

        function renderResult(payload) {
            resultContainer.innerHTML = "";

            const card = document.createElement("article");
            card.className = "model-card";

            const meta = document.createElement("div");
            meta.className = "model-meta";

            const modelName = document.createElement("span");
            modelName.className = "model-name";
            modelName.textContent = payload.modelName || "model.pth";

            const architecture = document.createElement("span");
            architecture.textContent = payload.architecture || "adaptive_224";

            const className = document.createElement("div");
            className.className = "class-name";
            className.textContent = payload.predictedClass || "Desconhecido";

            const modelConfidence = document.createElement("div");
            modelConfidence.className = "confidence";
            modelConfidence.textContent = `Confiança: ${formatPercent(payload.confidence)}`;

            const topList = document.createElement("ul");
            topList.className = "top-list";

            for (const item of payload.topPredictions || []) {
                const li = document.createElement("li");
                li.className = "top-item";

                const row = document.createElement("div");
                row.className = "top-row";

                const name = document.createElement("span");
                name.textContent = item.class;

                const value = document.createElement("span");
                value.textContent = formatPercent(item.confidence);

                const bar = document.createElement("div");
                bar.className = "bar";

                const fill = document.createElement("span");
                fill.style.width = formatPercent(item.confidence);

                row.append(name, value);
                bar.append(fill);
                li.append(row, bar);
                topList.append(li);
            }

            meta.append(modelName, architecture);
            card.append(meta, className, modelConfidence, topList);
            resultContainer.append(card);
        }

        function loadFile(file) {
            if (!file) {
                return;
            }

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

            previewUrl = URL.createObjectURL(file);
            preview.src = previewUrl;
            preview.classList.add("is-visible");
            emptyState.style.display = "none";
            submitButton.disabled = false;
            clearResult();
            setStatus(file.name);
        }

        chooseButton.addEventListener("click", () => input.click());

        input.addEventListener("change", () => {
            loadFile(input.files[0]);
        });

        dropzone.addEventListener("dragover", (event) => {
            event.preventDefault();
            dropzone.classList.add("is-dragging");
        });

        dropzone.addEventListener("dragleave", () => {
            dropzone.classList.remove("is-dragging");
        });

        dropzone.addEventListener("drop", (event) => {
            event.preventDefault();
            dropzone.classList.remove("is-dragging");

            const file = event.dataTransfer.files[0];

            if (!file) {
                return;
            }

            assignFile(file);
        });

        window.addEventListener("paste", (event) => {
            const items = Array.from(event.clipboardData?.items || []);
            const imageItem = items.find((item) => item.kind === "file" && item.type.startsWith("image/"));

            if (!imageItem) {
                return;
            }

            const file = imageItem.getAsFile();

            if (!file) {
                return;
            }

            event.preventDefault();

            const extension = file.type.split("/")[1] || "png";
            const namedFile = new File(
                [file],
                `pasted-image.${extension.replace("jpeg", "jpg")}`,
                { type: file.type || "image/png" }
            );

            assignFile(namedFile);
            setStatus("Imagem colada carregada.");
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const file = input.files[0];

            if (!file) {
                setStatus("Selecione uma imagem primeiro.", true);
                return;
            }

            const formData = new FormData();
            formData.append("image", file);

            clearResult();
            setBusy(true);
            setStatus("Analisando imagem...");

            try {
                const response = await fetch("/infer", {
                    method: "POST",
                    body: formData
                });

                const payload = await response.json().catch(() => null);

                if (!response.ok || !payload || payload.ok === false) {
                    throw new Error(payload?.error || `Requisição falhou com status ${response.status}`);
                }

                renderResult(payload);
                setStatus("Concluído.");
            } catch (error) {
                setStatus(error.message, true);
            } finally {
                setBusy(false);
            }
        });
    </script>
</body>
</html>
