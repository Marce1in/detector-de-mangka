[project]
name = "cnn-node-api-worker"
version = "1.0.0"
description = "Python inference worker dependencies for the CNN Node API."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
